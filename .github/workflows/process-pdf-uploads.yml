name: Process PDF Uploads

# Trigger when any PDF file is pushed to the repository,
# OR manually (e.g. to repair fallback-named images in existing folders).
on:
  push:
    paths:
      - '**.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install PDF conversion tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr

      - name: Convert PDFs to JPEG images
        id: convert
        run: |
          # Find all PDF files (excluding .git)
          mapfile -t pdfs < <(find . -name "*.pdf" -not -path "./.git/*" | sort)

          if [ "${#pdfs[@]}" -eq 0 ]; then
            echo "No PDF files found — nothing to do."
            echo "converted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found ${#pdfs[@]} PDF file(s): ${pdfs[*]}"

          for pdf in "${pdfs[@]}"; do
            raw_name=$(basename "$pdf" .pdf)
            # Sanitize: replace spaces, dots, commas and other non-safe chars with
            # underscores so the folder/file names never contain whitespace.
            # Dots between digits (e.g. "5.4") are preserved; trailing dots are not.
            pdf_name=$(echo "$raw_name" \
              | sed 's/[^a-zA-Z0-9._-]/_/g' \
              | sed 's/\._/_/g' \
              | sed 's/__*/_/g' \
              | sed 's/^[_.]*//;s/[_.]*$//')
            out_dir="images/${pdf_name}"

            echo "Processing: $pdf  →  $out_dir/"
            mkdir -p "$out_dir"

            # Convert each PDF page to a JPEG (200 dpi for readable handwriting)
            # pdftoppm with -jpeg produces files named: {prefix}-{N}.jpg
            pdftoppm -jpeg -r 200 "$pdf" "${out_dir}/${pdf_name}"

            # Collect output files sorted numerically (handles 10+ page PDFs correctly,
            # where a plain glob would give lexicographic order: -1, -10, -2, …).
            mapfile -t page_files < <(find "${out_dir}" -maxdepth 1 \
              -name "${pdf_name}-*.jpg" | sort -V)
            page_count=${#page_files[@]}

            if [ "$page_count" -eq 0 ]; then
              echo "  ERROR: pdftoppm produced no output for $pdf — skipping."
              continue
            fi

            # Count existing JPEG files in the folder to determine the starting index.
            # This ensures new pages are numbered AFTER any pre-existing images.
            shopt -s nullglob
            existing_jpegs=("${out_dir}"/*.jpeg)
            shopt -u nullglob
            next_index=$(( ${#existing_jpegs[@]} + 1 ))

            if [ "$page_count" -eq 1 ]; then
              # Single page: 01_{pdf_name}.jpeg (or next available index)
              mv "${page_files[0]}" "${out_dir}/$(printf '%02d' "$next_index")_${pdf_name}.jpeg"
            else
              # Multi-page: extract the heading from each page and use it as the
              # filename so images are named by topic, matching the convention of
              # older sections.
              #
              # Strategy (in order):
              #   1. pdftotext  – scans the first 5 non-blank lines of each page
              #                   (iPhone Scan Documents PDFs embed OCR text).
              #   2. tesseract  – runs directly on the converted JPEG as a fallback
              #                   when pdftotext returns no usable text.
              #   3. page-N     – last resort when neither method yields a heading.
              page_num=1
              for f in "${page_files[@]}"; do

                # --- Attempt 1: pdftotext (tries first 5 non-blank lines) ---
                topic=""
                while IFS= read -r line_raw; do
                  candidate=$(echo "$line_raw" \
                    | sed 's/[^a-zA-Z0-9 _]/ /g' \
                    | tr -s ' ' '_' \
                    | sed 's/^_*//;s/_*$//' \
                    | cut -c1-80)
                  if echo "$candidate" | grep -qE '[a-zA-Z].*[a-zA-Z]' && [ "${#candidate}" -ge 5 ]; then
                    topic="$candidate"
                    break
                  fi
                done < <(pdftotext -f "$page_num" -l "$page_num" "$pdf" - 2>/dev/null \
                  | sed '/^[[:space:]]*$/d' \
                  | head -5)

                # --- Attempt 2: tesseract OCR on the JPEG (fallback) ---
                # Try multiple PSM modes to improve heading detection for handwritten notes:
                #   PSM 3: Fully automatic page segmentation (good for structured layouts)
                #   PSM 6: Assume uniform block of text (original approach)
                #   PSM 4: Assume single column of text (good for notes)
                if [ -z "$topic" ]; then
                  for psm_mode in 3 6 4; do
                    topic_raw=$(tesseract "$f" stdout --psm "$psm_mode" 2>/dev/null \
                      | sed '/^[[:space:]]*$/d' \
                      | head -15 \
                      | grep -m1 -E '^[A-Za-z].*[A-Za-z]' \
                      | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                    
                    # Clean and validate the extracted topic
                    topic=$(echo "$topic_raw" \
                      | sed 's/[^a-zA-Z0-9 _]/ /g' \
                      | tr -s ' ' '_' \
                      | sed 's/^_*//;s/_*$//' \
                      | cut -c1-80)
                    
                    # Accept if valid heading found
                    if echo "$topic" | grep -qE '^[A-Za-z].*[A-Za-z]' && [ "${#topic}" -ge 5 ]; then
                      break
                    fi
                    topic=""
                  done
                fi

                if echo "$topic" | grep -qE '[a-zA-Z].*[a-zA-Z]' && [ "${#topic}" -ge 5 ]; then
                  target_name="$(printf '%02d' "$next_index")_${topic}.jpeg"
                else
                  target_name="$(printf '%02d' "$next_index")_${pdf_name}_page_$(printf '%02d' "$page_num").jpeg"
                fi

                mv "$f" "${out_dir}/${target_name}"
                next_index=$((next_index + 1))
                page_num=$((page_num + 1))
              done
            fi

            echo "  Converted $page_count page(s) into $out_dir/"

            # Remove the source PDF from disk (git cleanup happens in the commit step)
            rm -f "$pdf"
          done

          echo "converted=true" >> "$GITHUB_OUTPUT"

      - name: Repair fallback-named images with OCR
        run: |
          python3 << 'PYEOF'
          import os, re, subprocess

          IMAGES_DIR = "images"
          README = "README.md"

          def extract_topic_from_image(img_path):
              """
              Run tesseract OCR on the image and return the first meaningful
              heading line, or None if nothing usable is found.
              Tries PSM modes 3, 6, and 4 in order (3 first for better page structure detection).
              Prioritizes lines starting with a letter (more likely to be headings).
              """
              for psm in [3, 6, 4]:
                  result = subprocess.run(
                      ["tesseract", img_path, "stdout", "--psm", str(psm)],
                      capture_output=True, text=True
                  )
                  lines = result.stdout.splitlines()[:15]  # Check first 15 lines
                  for line in lines:
                      line = line.strip()
                      # Require line starts with a letter (more likely a heading),
                      # at least 5 characters, and contains two letters.
                      if len(line) >= 5 and re.match(r'^[A-Za-z]', line) and re.search(r'[a-zA-Z].*[a-zA-Z]', line):
                          topic = re.sub(r'[^a-zA-Z0-9 _]', ' ', line)
                          topic = re.sub(r'\s+', '_', topic).strip('_')[:80]
                          if re.match(r'^[A-Za-z]', topic) and re.search(r'[a-zA-Z].*[a-zA-Z]', topic):
                              return topic
              return None

          # Match fallback-named files: NN_<anything>_page_NN.jpeg (including edge
          # case where the base name is very short, e.g. NN_page_NN.jpeg)
          fallback_pat = re.compile(r'^(\d{2})_.*_page_\d{2}\.jpeg$')

          if not os.path.isfile(README):
              print("README not found, skipping repair.")
          else:
              with open(README, "r", encoding="utf-8") as fh:
                  content = fh.read()

              all_renames = []

              for folder in sorted(os.listdir(IMAGES_DIR)):
                  folder_path = os.path.join(IMAGES_DIR, folder)
                  if not os.path.isdir(folder_path):
                      continue

                  for filename in sorted(os.listdir(folder_path)):
                      m = fallback_pat.match(filename)
                      if not m:
                          continue

                      prefix = m.group(1)   # e.g. "01"
                      img_path = os.path.join(folder_path, filename)

                      print(f"  OCR scan: {folder}/{filename}")
                      topic = extract_topic_from_image(img_path)

                      if not topic:
                          print(f"    No topic extracted — keeping original name")
                          continue

                      new_filename = f"{prefix}_{topic}.jpeg"
                      if filename == new_filename:
                          continue

                      new_path = os.path.join(folder_path, new_filename)
                      old_rel = f"images/{folder}/{filename}"
                      new_rel = f"images/{folder}/{new_filename}"
                      print(f"    Renaming → {new_filename}")
                      all_renames.append((img_path, new_path, old_rel, new_rel))

              for old_path, new_path, _, _ in all_renames:
                  os.rename(old_path, new_path)

              new_content = content
              for _, _, old_rel, new_rel in all_renames:
                  new_content = new_content.replace(old_rel, new_rel)

              if new_content != content:
                  with open(README, "w", encoding="utf-8") as fh:
                      fh.write(new_content)
                  print(f"README updated: {len(all_renames)} image(s) renamed.")
              elif all_renames:
                  print(f"{len(all_renames)} image(s) renamed (README unchanged).")
              else:
                  print("No fallback-named images found — nothing to repair.")
          PYEOF

      - name: Re-number existing images by README order
        run: |
          python3 << 'PYEOF'
          import os, re

          README = "README.md"
          IMAGES_DIR = "images"

          with open(README, "r", encoding="utf-8") as fh:
              content = fh.read()

          # Extract ordered image references from README
          pattern = r'images/([^/\)]+)/([^/\)]+\.jpeg)'
          matches = re.findall(pattern, content)

          folder_images = {}
          for folder, img in matches:
              if folder not in folder_images:
                  folder_images[folder] = []
              if img not in folder_images[folder]:
                  folder_images[folder].append(img)

          all_renames = []

          for folder, imgs in folder_images.items():
              folder_path = os.path.join(IMAGES_DIR, folder)
              if not os.path.isdir(folder_path):
                  continue

              for i, img in enumerate(imgs):
                  # Strip any existing numeric prefix (e.g. "01_") before re-numbering
                  base_name = re.sub(r'^\d{2}_', '', img)
                  new_name = f"{i+1:02d}_{base_name}"

                  if img == new_name:
                      continue  # Already correctly numbered

                  old_abs = os.path.join(folder_path, img)
                  new_abs = os.path.join(folder_path, new_name)
                  old_rel = f"images/{folder}/{img}"
                  new_rel = f"images/{folder}/{new_name}"

                  if os.path.exists(old_abs):
                      all_renames.append((old_abs, new_abs, old_rel, new_rel))

          # Rename via temp files to avoid collisions
          temp_map = []
          for old_abs, new_abs, old_rel, new_rel in all_renames:
              temp = old_abs + ".tmp_rename"
              os.rename(old_abs, temp)
              temp_map.append((temp, new_abs))
          for temp, new_abs in temp_map:
              os.rename(temp, new_abs)

          # Update README references
          new_content = content
          for _, _, old_rel, new_rel in all_renames:
              new_content = new_content.replace(old_rel, new_rel)

          if new_content != content:
              with open(README, "w", encoding="utf-8") as fh:
                  fh.write(new_content)
              print(f"Re-numbered {len(all_renames)} image(s) and updated README.")
          else:
              print("All images already correctly numbered.")
          PYEOF

      - name: Update README with new images
        if: steps.convert.outputs.converted == 'true'
        run: |
          python3 << 'PYEOF'
          import os
          import re

          README = "README.md"
          IMAGES_DIR = "images"

          with open(README, "r", encoding="utf-8") as fh:
              content = fh.read()

          new_sections = ""
          new_toc_entries = ""
          changed = False

          for folder in sorted(os.listdir(IMAGES_DIR)):
              folder_path = os.path.join(IMAGES_DIR, folder)
              if not os.path.isdir(folder_path):
                  continue

              jpegs = sorted(f for f in os.listdir(folder_path) if f.endswith(".jpeg"))
              if not jpegs:
                  continue

              # --- Build section heading from folder name ---------------
              # e.g. "6.1_New_Topic_Name" → section "6.1. New Topic Name"
              m = re.match(r'^(\d+(?:\.\d+)?)_(.*)', folder)
              if m:
                  section_num = m.group(1)
                  section_label = m.group(2).replace("_", " ")
                  heading = f"{section_num}. {section_label}"
              else:
                  heading = folder.replace("_", " ")
                  section_num = ""

              # Detect which images from this folder are already referenced as actual
              # markdown links in the README: pattern `(images/folder/file.jpeg)`.
              # This deliberately excludes bare paths in code-block examples, which
              # are plain text without the surrounding parentheses of a markdown link.
              already_in_readme = set(
                  re.findall(
                      rf'\(images/{re.escape(folder)}/([^/)]+\.jpeg)\)',
                      content
                  )
              )
              folder_in_readme = bool(already_in_readme)

              if not folder_in_readme:
                  # -------------------------------------------------------
                  # Brand-new folder: add TOC entry + full section body
                  # -------------------------------------------------------
                  first_jpeg = jpegs[0]
                  toc_line = (
                      f"- [{heading}]({IMAGES_DIR}/{folder})"
                      f" — [preview]({IMAGES_DIR}/{folder}/{first_jpeg})\n"
                  )
                  new_toc_entries += toc_line

                  section_body = f"\n---\n\n## {heading}\n\n"
                  for jpeg in jpegs:
                      display = re.sub(r'^\d{2}_', '', jpeg)
                      topic = display.replace(".jpeg", "").replace("_", " ")
                      section_body += f"### {topic}\n\n"
                      section_body += f"[{topic}]({IMAGES_DIR}/{folder}/{jpeg})\n\n"

                  new_sections += section_body
                  print(f"  New section queued: {heading}  ({len(jpegs)} image(s))")

              else:
                  # -------------------------------------------------------
                  # Existing folder: find images on disk not yet in README
                  # and append them to the existing section body.
                  # -------------------------------------------------------
                  new_jpegs = [j for j in jpegs if j not in already_in_readme]

                  if not new_jpegs:
                      continue  # Nothing new — skip

                  print(f"  Appending {len(new_jpegs)} new image(s) to section: {heading}")

                  # Build the extra lines to append inside the existing section.
                  extra_lines = ""
                  for jpeg in new_jpegs:
                      display = re.sub(r'^\d{2}_', '', jpeg)
                      topic = display.replace(".jpeg", "").replace("_", " ")
                      extra_lines += f"### {topic}\n\n"
                      extra_lines += f"[{topic}]({IMAGES_DIR}/{folder}/{jpeg})\n\n"

                  # Find the end of this section in the README (the next "---"
                  # separator, or end-of-file) and insert before it.
                  section_header = f"## {heading}"
                  section_start = content.find(section_header)
                  if section_start == -1:
                      # Links were found but the section heading doesn't match
                      # (can happen when the README heading was manually edited).
                      # Fall back to appending at end; log a warning.
                      print(f"  WARNING: could not locate section '{section_header}' in README — appending at end.")
                      content = content.rstrip() + "\n\n" + extra_lines
                  else:
                      # Find the next "---" after this section heading
                      next_sep = content.find("\n---\n", section_start)
                      if next_sep == -1:
                          # Last section — insert before end of file
                          content = content.rstrip() + "\n\n" + extra_lines
                      else:
                          content = content[:next_sep] + "\n\n" + extra_lines.rstrip() + content[next_sep:]

                  changed = True

          if new_sections:
              # Append new sections at the end of the README
              content = content.rstrip() + "\n" + new_sections
              changed = True

              # Insert new TOC entries before the first "---" separator
              if new_toc_entries:
                  toc_end = content.find("\n---\n")
                  if toc_end != -1:
                      content = content[:toc_end] + "\n" + new_toc_entries.rstrip() + content[toc_end:]

          if changed:
              with open(README, "w", encoding="utf-8") as fh:
                  fh.write(content)
              print("README updated successfully.")
          else:
              print("README already up-to-date — no new images found.")
          PYEOF

      - name: Commit and push changes
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Stage new JPEG images and updated README
          git add images/ README.md
          # Remove any PDF files still tracked by git (they were deleted on disk)
          git ls-files --deleted | grep -i '\.pdf$' | xargs -r git rm --cached 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Convert PDF upload(s) to JPEG images [automated]"
            git push
          fi
